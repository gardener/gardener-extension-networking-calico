name: Renovate Post-Upgrade Tasks

on:
  pull_request:
    branches:
      - master
      - 'release-v*'

permissions:
  contents: read

jobs:
  post-upgrade-tasks:
    name: Run Post-Upgrade Tasks
    # Only run for genuine Renovate PRs: authored by the Renovate app, from a renovate/* branch
    # in this repository. The actor check prevents any org member from naming a branch renovate/*
    # to have their own Makefile output committed back and laundered as the bot.
    if: >-
      github.repository == 'gardener/gardener-extension-networking-calico' &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      startsWith(github.head_ref, 'renovate/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has-changes: ${{ steps.diff.outputs.has-changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
          # Full history is required to diff against the PR base commit.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: Run post-upgrade tasks
        run: |
          set -euo pipefail
          export PATH="${PATH}:$(go env GOROOT)/bin"
          make generate MODE="sequential"
          # `make generate` installs the version-pinned tools (incl. yq, pinned in the
          # vendored gardener/hack/tools.mk) under hack/tools/bin/<os>-<arch>. Expose them
          # so the bare `yq`/tool calls in the scripts below resolve to those versions.
          export PATH="${PWD}/hack/tools/bin/$(go env GOOS)-$(go env GOARCH):${PATH}"
          hack/update-cni-plugins-checksums.sh
          # Keep the vendored Calico CRDs in lockstep with the image tag Renovate just
          # bumped. Fails if the bump orphans a CRD file (must be removed manually).
          hack/update-calico-crds.sh
      - name: Capture changes
        id: diff
        run: |
          set -euo pipefail
          # Only capture the paths the post-upgrade tasks legitimately write: the generated
          # charts/code/examples, the Renovate ignore-deps config, the Calico CRDs refreshed by
          # update-calico-crds.sh (under charts/), and the CNI plugin checksums in the Dockerfile.
          # This prevents the committed-back patch from carrying arbitrary content a branch's
          # Makefile might have produced elsewhere in the tree.
          git add -A -- 'charts/**' 'cmd/**' 'example/**' 'pkg/**' 'renovate.json5' 'Dockerfile'
          if git diff --cached --quiet; then
            echo "has-changes=false" >> "${GITHUB_OUTPUT}"
          else
            echo "has-changes=true" >> "${GITHUB_OUTPUT}"
            git diff --cached --binary > "${RUNNER_TEMP}/post-upgrade.patch"
          fi
      - name: Upload patch
        if: steps.diff.outputs.has-changes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: post-upgrade-changes
          path: ${{ runner.temp }}/post-upgrade.patch
          retention-days: 1

  commit:
    name: Commit Changes
    needs: post-upgrade-tasks
    if: needs.post-upgrade-tasks.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up git identity
        uses: gardener/cc-utils/.github/actions/setup-git-identity@v1
      - name: Download patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: post-upgrade-changes
          path: ${{ runner.temp }}
      - name: Apply patch and push
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git apply --3way --whitespace=nowarn "${RUNNER_TEMP}/post-upgrade.patch"
          git add -A
          git commit -m "Run post-upgrade tasks"
          git push origin "HEAD:${HEAD_REF}"
