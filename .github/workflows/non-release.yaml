name: Build
on:
  # Only pushes to the default branch and release branches publish credentialed
  # snapshot artifacts (the component-descriptor job below runs with contents: write).
  # Other branches are validated through pull_request without reaching that
  # credentialed path.
  push:
    branches:
      - master
      - release-*
  pull_request:

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    with:
      mode: snapshot
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write

  component-descriptor:
    uses: gardener/cc-utils/.github/workflows/post-build.yaml@v1
    needs:
      - build
    permissions:
      id-token: write
      contents: write
